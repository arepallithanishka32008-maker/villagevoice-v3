{% extends "base.html" %}

{% block content %}

<section class="login">
    <div>
        <small>GRAMA SACHIVALAYAM</small>

        <h1>Officer sign in</h1>

        <p class="muted">
            For the Karyadarsi and Sachivalayam staff. See verified village problems,
            get directions, and update progress.
        </p>
    </div>

    <form class="panel form" method="post">
        <label>
            Password
            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
            >
        </label>

        <button class="btn">Sign in →</button>
    </form>
</section>

{% endblock %}
